# Robotic hand configuration. Every hardware number lives here.
# Units: millimetres and degrees unless stated otherwise.
#
# Every value marked "# TODO hardware" is a placeholder. Get the real number from
# the hardware team (see README "Numbers needed from the hardware team") before
# running without --mock.
#
# TABLE FRAME: origin at the centre of ArUco marker 0, +x towards marker 1,
# +y towards marker 3, +z up from the table surface.

serial:
  port: null                 # e.g. "COM5" or "/dev/ttyUSB0"; overridden by --port
  baud: 115200
  move_timeout_s: 10.0       # max wait for DONE after a command
  boot_wait_s: 3.0           # Arduino resets when the port opens; wait for READY
  retries: 1                 # re-send a timed-out command this many times
  mock_move_time_s: 0.02     # fake move duration in --mock mode (0 = instant)

arm:
  # Position of the base yaw axis in the table frame.
  base_xy_mm: [300.0, -60.0]           # TODO hardware (measure with `python camera.py check`)
  # Table-frame direction (deg, CCW from +x) the arm points when the base joint is 0.
  base_yaw_offset_deg: 90.0            # TODO hardware
  # Height of the shoulder pivot above the table surface.
  shoulder_height_mm: 100.0            # TODO hardware
  link_lengths_mm:
    upper: 150.0                       # TODO hardware: shoulder pivot -> elbow pivot
    fore: 150.0                        # TODO hardware: elbow pivot -> wrist pivot
    hand: 100.0                        # TODO hardware: wrist pivot -> grasp centre (between fingertips when closed)

  # Joint angles (kinematic convention used by the IK):
  #   base     0 = pointing along base_yaw_offset_deg, + = CCW seen from above
  #   shoulder angle of upper arm above horizontal (90 = straight up)
  #   elbow    forearm angle relative to upper arm (0 = straight, - = bent down)
  #   wrist    hand angle relative to forearm (0 = in line, - = bent down)
  # Hand pitch in the world = shoulder + elbow + wrist (-90 = pointing straight down).
  joint_names: [base, shoulder, elbow, wrist]
  joint_limits_deg:                    # enforced in Python before anything is sent
    base: [-85.0, 85.0]                # TODO hardware
    shoulder: [10.0, 170.0]            # TODO hardware
    elbow: [-160.0, 0.0]               # TODO hardware
    wrist: [-90.0, 90.0]               # TODO hardware

  # Servo command = offset + sign * joint_angle  (servo degrees, 0..180)
  servo_offset_deg: [90.0, 0.0, 180.0, 90.0]   # TODO hardware
  servo_sign: [1, 1, 1, 1]                     # TODO hardware (+1 or -1 each)

  home_deg: [0.0, 90.0, -90.0, 0.0]    # joint angles of the safe home pose  # TODO hardware

grasp:
  # Hand pitch candidates tried in order (-90 = top-down). Tilted pitches extend reach.
  pitch_candidates_deg: [-90, -80, -70, -60, -50, -45]
  finger_depth_mm: 35.0          # TODO hardware: how far below the object top the grasp centre goes
  min_grasp_z_mm: 15.0           # never put the grasp centre lower than this above the table
  approach_clearance_mm: 60.0    # hover height above an object top before descending
  safe_z_mm: 150.0               # minimum travel height between objects (raised automatically for tall objects)
  place_clearance_mm: 10.0       # release this far above the resting position
  cartesian_step_mm: 20.0        # straight-line moves are split into steps this long
  max_joint_jump_deg: 35.0       # reject a straight-line move whose IK jumps more than this per step
  grasp_retries: 2               # extra pick attempts after a failed grasp check
  verify_offset_mm: 80.0         # after lifting, move this far towards the base so the camera can see the old spot

hand:
  # Five finger servos f0..f4 (thumb, index, middle, ring, little), servo degrees 0..180.
  finger_names: [thumb, index, middle, ring, little]
  open: [10, 10, 10, 10, 10]                   # TODO hardware
  # The smallest preset whose max_width_mm >= object width is used.
  grasps:                                      # TODO hardware: all finger values
    - {name: pinch,  max_width_mm: 30,  fingers: [120, 130, 40, 40, 40]}
    - {name: medium, max_width_mm: 60,  fingers: [110, 120, 120, 110, 100]}
    - {name: wide,   max_width_mm: 95,  fingers: [80, 90, 90, 85, 80]}
  limits_deg: [[0, 180], [0, 180], [0, 180], [0, 180], [0, 180]]   # TODO hardware

camera:
  index: 0                       # cv2.VideoCapture index
  width: 1280
  height: 720
  height_mm: 700.0               # TODO hardware: table surface -> camera lens (optical centre)
  intrinsics_path: calib/intrinsics.npz
  aruco_dict: DICT_4X4_50
  marker_size_mm: 50.0           # printed black-square side length
  # Centre of each marker in the table frame (marker 0 is the origin).
  markers_mm:                    # TODO hardware: measure after taping the markers down
    0: [0.0, 0.0]
    1: [600.0, 0.0]
    2: [600.0, 400.0]
    3: [0.0, 400.0]

vision:
  model: yolov8n.pt              # ultralytics weights (downloaded on first use)
  confidence: 0.4
  # Box centres sit roughly half-way up an object seen from above, so parallax is
  # corrected at height_mm * this fraction. Set to 1.0 for the literal object-top formula.
  parallax_height_fraction: 0.5
  lift_check_frames: 3           # frames examined by object_lifted()
  lift_check_radius_mm: 30.0     # an object within this distance of its old spot = not lifted
  # Size lookup per YOLO class name. Unknown classes use "default".
  objects:
    default:      {height_mm: 60,  width_mm: 50}
    cup:          {height_mm: 90,  width_mm: 70}
    bottle:       {height_mm: 200, width_mm: 65}
    sports ball:  {height_mm: 65,  width_mm: 65}
    apple:        {height_mm: 75,  width_mm: 75}
    orange:       {height_mm: 70,  width_mm: 70}
    banana:       {height_mm: 40,  width_mm: 40}
    cell phone:   {height_mm: 10,  width_mm: 70}
    scissors:     {height_mm: 15,  width_mm: 60}

# Fixed named drop-off spots in the table frame, usable as a "place" target.
locations:
  left zone:  {x: 120.0, y: 150.0}
  right zone: {x: 480.0, y: 150.0}

planner:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-chat           # non-reasoning model; DeepSeek renames models, check their docs
  temperature: 0.0
  max_replans: 2
  timeout_s: 30.0
